name: Release to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        # A hung test fails the job after 10 minutes (hard kill 10 s later) with a stack dump
        # (faulthandler) instead of running for hours without logs.
        run: timeout -k 10 600 uv run python -m pytest tests/ -v -o faulthandler_timeout=60

      - name: Build package
        run: uv build

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" &>/dev/null; then
            echo "Release ${{ github.ref_name }} already exists, skipping."
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi

  mcp-registry:
    # After PyPI: the registry checks that the package version it lists
    # exists there. Publishes server.json under com.getadloop with the DNS
    # key for getadloop.com, so no manual mcp-publisher login is needed.
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check server.json matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version server.json)"
          package="$(jq -r '.packages[0].version' server.json)"
          if [ "$version" != "$tag" ] || [ "$package" != "$tag" ]; then
            echo "server.json says $version / $package, tag is $tag" >&2
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher

      - name: Publish to the MCP registry
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          ./mcp-publisher login dns --domain getadloop.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish
